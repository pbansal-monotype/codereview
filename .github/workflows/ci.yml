name: CI & AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_call:
    inputs:
      provider:
        description: 'AI provider: anthropic, openai, or azure'
        type: string
        default: 'anthropic'
      model:
        description: 'Model override (or Azure deployment name)'
        type: string
        default: ''
      azure_endpoint:
        description: 'Azure OpenAI endpoint URL (required when provider is azure)'
        type: string
        default: ''
      review_categories:
        description: 'Comma-separated categories to review'
        type: string
        default: 'security,tests,performance,code'
      repo_context:
        description: 'Repository overview (tech stack, architecture, key files)'
        type: string
        default: ''
      review_policy:
        description: 'Review policy and standards'
        type: string
        default: ''
      security_guidelines:
        description: 'Custom security guidelines'
        type: string
        default: ''
      test_guidelines:
        description: 'Custom test guidelines'
        type: string
        default: ''
      performance_guidelines:
        description: 'Custom performance guidelines'
        type: string
        default: ''
      code_guidelines:
        description: 'Custom code quality guidelines'
        type: string
        default: ''
      ignore_paths:
        description: 'Glob patterns to skip'
        type: string
        default: ''
    secrets:
      api_key:
        description: 'Override API key (if not set, uses centralized key from this repo)'
        required: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    # Only run for direct push/PR in this repo, not when called as a reusable workflow
    if: ${{ inputs.provider == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - name: Verify dist bundle exists
        run: test -f dist/index.js

  review:
    name: AI Review
    # Run on PRs (direct or via workflow_call), skip on push-to-main
    if: ${{ github.event_name == 'pull_request' || inputs.provider != '' }}
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.api_key || secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.api_key || secrets.OPENAI_API_KEY }}
      AZURE_API_KEY: ${{ secrets.api_key || secrets.AZURE_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run AI PR Review
        uses: ./
        with:
          github_token: ${{ github.token }}
          api_key: ${{ secrets.api_key || secrets.ANTHROPIC_API_KEY || secrets.OPENAI_API_KEY || secrets.AZURE_API_KEY }}
          provider: ${{ inputs.provider || 'anthropic' }}
          model: ${{ inputs.model || '' }}
          azure_endpoint: ${{ inputs.azure_endpoint || '' }}
          review_categories: ${{ inputs.review_categories || 'security,tests,performance,code' }}
          repo_context: ${{ inputs.repo_context || '' }}
          review_policy: ${{ inputs.review_policy || '' }}
          security_guidelines: ${{ inputs.security_guidelines || '' }}
          test_guidelines: ${{ inputs.test_guidelines || '' }}
          performance_guidelines: ${{ inputs.performance_guidelines || '' }}
          code_guidelines: ${{ inputs.code_guidelines || '' }}
          ignore_paths: ${{ inputs.ignore_paths || '' }}
