name: 'AI PR Reviewer'
description: 'AI-powered PR review with configurable company guidelines for security, testing, performance, cost, and custom checks'
author: 'Your Company'

branding:
  icon: 'eye'
  color: 'blue'

inputs:
  provider:
    description: 'AI provider to use: "anthropic", "openai", or "azure"'
    required: true
    default: 'anthropic'

  api_key:
    description: 'API key for the AI provider. If not set, reads from ANTHROPIC_API_KEY, OPENAI_API_KEY, or AZURE_API_KEY secret automatically based on provider.'
    required: false
    default: ''

  azure_endpoint:
    description: 'Azure OpenAI endpoint URL (required when provider is "azure"). Accepts the full deployment URL (e.g. https://<resource>.cognitiveservices.azure.com/openai/deployments/<deployment>/chat/completions?api-version=...) or just the bare resource URL. Can also be set via the AZURE_ENDPOINT env var.'
    required: false
    default: ''

  model:
    description: 'Model to use. For Azure, this is the deployment name (e.g. "gpt-5.4-nano"). For Anthropic: "claude-sonnet-4-20250514". For OpenAI: "gpt-4o".'
    required: false
    default: ''

  github_token:
    description: 'GitHub token for accessing PR data and posting comments. Defaults to the built-in GITHUB_TOKEN.'
    required: false
    default: ${{ github.token }}

  review_categories:
    description: 'Comma-separated list of categories to review: security,tests,performance,code,custom'
    required: false
    default: 'security,tests,performance,code'

  security_guidelines:
    description: 'Custom security review guidelines'
    required: false
    default: ''

  test_guidelines:
    description: 'Custom test case review guidelines'
    required: false
    default: ''

  performance_guidelines:
    description: 'Custom performance review guidelines'
    required: false
    default: ''

  code_guidelines:
    description: 'Custom code quality review guidelines (error handling, correctness, patterns)'
    required: false
    default: ''

  repo_context:
    description: 'Repository overview — tech stack, architecture, key files, conventions. Sent alongside PR data so agents understand the codebase.'
    required: false
    default: ''

  review_policy:
    description: 'Review policy and standards — coding rules, compliance requirements, team conventions. Injected into every agent system prompt.'
    required: false
    default: ''

  ignore_paths:
    description: 'Comma-separated glob patterns for files to skip (e.g. "**/migrations/**,**/*.generated.ts")'
    required: false
    default: ''

  incremental_review:
    description: 'Enable incremental reviews — only review new changes since the last reviewed commit (true/false). Requires a state store to persist the last reviewed SHA.'
    required: false
    default: 'true'

  state_store:
    description: 'Where to persist review state for incremental reviews. "comment-marker" embeds state in the PR review comment (zero config). "gist" stores state in a GitHub Gist (requires state_gist_id). "none" disables state persistence.'
    required: false
    default: 'comment-marker'

  state_gist_id:
    description: 'GitHub Gist ID for state persistence when state_store is "gist". Create a gist with any content and paste its ID here.'
    required: false
    default: ''

  supabase_url:
    description: 'Supabase project URL (e.g. https://abcdefgh.supabase.co) for recording run history and findings. Leave empty to disable history tracking. Apply src/history/schema.sql to your database first.'
    required: false
    default: ''

  supabase_key:
    description: 'Supabase secret key (sb_secret_... or the legacy service_role key) used to insert history rows. Pass this from a repository secret, never inline. Required when supabase_url is set.'
    required: false
    default: ''

outputs:
  review_body:
    description: 'The full review text generated by the AI'
  has_critical_issues:
    description: 'Whether critical issues were found (true/false)'
  categories_reviewed:
    description: 'Comma-separated list of categories that were reviewed'
  findings_count:
    description: 'Number of structured findings returned by the AI'
  history_run_id:
    description: 'UUID of the history row recorded for this run, or empty when history tracking is disabled or the write failed'

runs:
  using: 'node24'
  main: 'dist/index.js'
