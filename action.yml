name: 'AI PR Reviewer'
description: 'AI-powered PR review with configurable company guidelines for security, testing, performance, cost, and custom checks'
author: 'Your Company'

branding:
  icon: 'eye'
  color: 'blue'

inputs:
  provider:
    description: 'AI provider to use: "anthropic" or "openai"'
    required: true
    default: 'anthropic'

  api_key:
    description: 'API key for the chosen AI provider (use GitHub Secrets)'
    required: true

  model:
    description: 'Model to use (e.g. "claude-sonnet-4-20250514" for Anthropic, "gpt-4o" for OpenAI)'
    required: false
    default: ''

  github_token:
    description: 'GitHub token for accessing PR data and posting comments'
    required: true
    default: ${{ github.token }}

  config_path:
    description: 'Path to the review configuration YAML file (relative to repo root)'
    required: false
    default: '.github/pr-review-config.yml'

  review_categories:
    description: 'Comma-separated list of categories to review: security,tests,performance,cost,custom'
    required: false
    default: 'security,tests,performance,cost'

  security_guidelines:
    description: 'Custom security review guidelines (overrides config file)'
    required: false
    default: ''

  test_guidelines:
    description: 'Custom test case review guidelines (overrides config file)'
    required: false
    default: ''

  performance_guidelines:
    description: 'Custom performance review guidelines (overrides config file)'
    required: false
    default: ''

  cost_guidelines:
    description: 'Custom cost/billing review guidelines (overrides config file)'
    required: false
    default: ''

  custom_prompt:
    description: 'Additional custom prompt text sent to the AI alongside the review'
    required: false
    default: ''

  extra_instructions:
    description: 'Free-form text appended to every AI call (company-wide policies, tone, etc.)'
    required: false
    default: ''

  max_diff_size:
    description: 'Maximum diff size in characters before truncation (default 60000)'
    required: false
    default: '60000'

  post_review_comment:
    description: 'Whether to post the review as a PR comment (true/false)'
    required: false
    default: 'true'

  fail_on_critical:
    description: 'Fail the action if critical issues are found (true/false)'
    required: false
    default: 'false'

  ignore_paths:
    description: 'Comma-separated glob patterns for files to skip (e.g. "**/migrations/**,**/*.generated.ts")'
    required: false
    default: ''

  redact_secrets:
    description: 'Redact potential secrets from diff before sending to AI (true/false)'
    required: false
    default: 'true'

outputs:
  review_body:
    description: 'The full review text generated by the AI'
  has_critical_issues:
    description: 'Whether critical issues were found (true/false)'
  categories_reviewed:
    description: 'Comma-separated list of categories that were reviewed'
  findings_count:
    description: 'Number of structured findings returned by the AI'

runs:
  using: 'node20'
  main: 'dist/index.js'
